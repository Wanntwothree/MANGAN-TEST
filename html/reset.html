<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MANGAN | Reset password</title>

  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/frontPage.css">
  <link rel="stylesheet" href="../css/login-register.css">
</head>
<body>

  <header id="navbar">
    <div class="nav-inner">
      <a href="frontPage.html" id="textLogo">MANGAN</a>
    </div>
  </header>

  <main class="front-container login-card">
    <div class="front-text">
      <h1>Reset password</h1>
      <p id="forgotInfo">Choose a new password. Use at least 8 characters with upper and lower case letters, a number, and a symbol.</p>

      <form id="resetForm">
        <div class="loginContainer">
          <label for="newPass">New password</label>
          <div class="box">
            <input type="password" id="newPass" placeholder="Enter new password" autocomplete="new-password" required>
            <button type="button" class="eye" onclick="toggle('newPass', this)" aria-label="Show password">
              <svg class="open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg class="off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.9 10.9 0 0 1 12 19c-7 0-11-7-11-7a19.8 19.8 0 0 1 5.06-5.94M9.9 4.24A10.9 10.9 0 0 1 12 4c7 0 11 7 11 7a19.9 19.9 0 0 1-3.17 4.19M1 1l22 22"/><path d="M14.12 14.12A3 3 0 0 1 9.88 9.88"/></svg>
            </button>
          </div>

          <label for="newPass2">Confirm password</label>
          <div class="box">
            <input type="password" id="newPass2" placeholder="Confirm new password" autocomplete="new-password" required>
            <button type="button" class="eye" onclick="toggle('newPass2', this)" aria-label="Show password">
              <svg class="open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg class="off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.9 10.9 0 0 1 12 19c-7 0-11-7-11-7a19.8 19.8 0 0 1 5.06-5.94M9.9 4.24A10.9 10.9 0 0 1 12 4c7 0 11 7 11 7a19.9 19.9 0 0 1-3.17 4.19M1 1l22 22"/><path d="M14.12 14.12A3 3 0 0 1 9.88 9.88"/></svg>
            </button>
          </div>

          <p class="msg" role="status" aria-live="polite"></p><br>
          <p id="matchHint" class="match-hint" aria-live="polite"></p>
          <button type="submit" class="btn">Change password</button>
        </div>
      </form>

      <p class="switch"><a href="login.html">Back to log in</a></p>
      
    </div>
  </main>

  <script src="../js/login-register.js"></script>
  <script src="../js/reset.js"></script>
</body>
</html>
