<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MANGAN | Verify email</title>

  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/frontPage.css">
  <link rel="stylesheet" href="../css/login-register.css">
  <link rel="stylesheet" href="../css/verify.css">
</head>
<body>

  <header id="navbar">
    <div class="nav-inner">
      <span id="textLogo">MANGAN</span>
    </div>
  </header>

  <main class="front-container login-card">
    <div class="front-text">
      <h1>Verify your email</h1>
      <p id="verifyInfo"></p>

      <form id="verifyForm">
        <div class="loginContainer">
          <input type="text" id="verifyCode" inputmode="numeric" maxlength="6" placeholder="------" autocomplete="one-time-code" required>

          <p class="msg" id="verifyMsg" role="status" aria-live="polite"></p>

          <div class="verify-actions">
            <button type="submit" class="btn" id="verifyBtn">Verify</button>
            <button type="button" class="btn secondary" id="resendBtn">Resend code</button>
          </div>
        </div>
      </form>

      <p class="switch"><a href="register.html" id="backLink">Use a different email</a></p>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <script src="../js/email-config.js"></script>
  <script src="../js/login-register.js"></script>
  <script src="../js/verify-core.js"></script>
  <script src="../js/verify.js"></script>
</body>
</html>
