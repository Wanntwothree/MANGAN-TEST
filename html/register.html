<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MANGAN | Register</title>

  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/frontPage.css">
  <link rel="stylesheet" href="../css/login-register.css">
</head>
<body>

  <header id="navbar">
    <div class="nav-inner">
      <span id="textLogo">MANGAN</span>
      <ul class="nav-links">
        <li><a href="frontPage.html">Home</a></li>
        <li><a href="/html/login.html" class="active">Login</a></li>
      </ul>
    </div>
  </header>

  <main class="front-container register-card">
    <div class="front-text">
      <h1>Create your account</h1>

      <form id="registerForm">
        <div class="registerContainer">
            <label for="regName">Name</label>
            <input type="text" id="regName" placeholder="Enter your name" autocomplete="name" required>

            <label for="regEmail">Email</label>
            <input type="email" id="regEmail" placeholder="Enter your email" autocomplete="email" required>

            <label for="regPass">Password</label>
            <div class="box">
            <input type="password" id="regPass" placeholder="At least 8 characters" minlength="8" autocomplete="new-password" required>
            <button type="button" class="eye" onclick="toggle('regPass', this)" aria-label="Show password">
                <svg class="open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>
                <svg class="off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.9 10.9 0 0 1 12 19c-7 0-11-7-11-7a19.8 19.8 0 0 1 5.06-5.94M9.9 4.24A10.9 10.9 0 0 1 12 4c7 0 11 7 11 7a19.9 19.9 0 0 1-3.17 4.19M1 1l22 22"/><path d="M14.12 14.12A3 3 0 0 1 9.88 9.88"/></svg>
            </button>
            </div>

            <ul class="rules" id="pwRules">
                <li data-rule="length">At least 8 characters</li>
                <li data-rule="upper">One uppercase letter</li>
                <li data-rule="lower">One lowercase letter</li>
                <li data-rule="number">One number</li>
                <li data-rule="special">One special character (_ @ # ! etc.)</li>
            </ul>
            
            <label for="regConfirm">Confirm password</label>
            <div class="box">
            <input type="password" id="regConfirm" placeholder="Type it again" minlength="6" autocomplete="new-password" required>
            <button type="button" class="eye" onclick="toggle('regConfirm', this)" aria-label="Show password">
                <svg class="open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>
                <svg class="off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.9 10.9 0 0 1 12 19c-7 0-11-7-11-7a19.8 19.8 0 0 1 5.06-5.94M9.9 4.24A10.9 10.9 0 0 1 12 4c7 0 11 7 11 7a19.9 19.9 0 0 1-3.17 4.19M1 1l22 22"/><path d="M14.12 14.12A3 3 0 0 1 9.88 9.88"/></svg>
            </button>
            </div>

            <p class="msg" id="regMsg" role="status" aria-live="polite"></p>
            <button type="submit" class="btn">Create account</button>
        </div>
        
      </form>

      <p class="switch">Already have an account? <a href="login.html">Log in</a></p>
    </div>
  </main>

    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script src="../js/email-config.js"></script>
    <script src="../js/verify-core.js"></script>
    <script src="../js/register-verify.js"></script>
    <script src="../js/login-register.js"></script>
</body>
</html>
