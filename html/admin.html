<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MANGAN | Admin</title>

  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/frontPage.css">
  <link rel="stylesheet" href="../css/admin.css">

  <!-- Guard: runs before the page shows. Only the admin can stay. -->
  <script>
    try {
      if (localStorage.getItem("demoCurrentUser") !== "admin@mangan.com") {
        window.location.replace("login.html");
      }
    } catch (e) {
      window.location.replace("login.html");
    }
  </script>
</head>
<body>

  <header id="navbar">
    <div class="nav-inner">
      <span id="textLogo">MANGAN</span>
      <div class="admin-right">
        <span class="tag">Admin</span>
        <button type="button" class="logout" id="logoutBtn">Log out</button>
      </div>
    </div>
  </header>

  <main class="admin-main">
    <div class="panel head">
        <h1>Registered users</h1>
        <p class="sub">See everyone who has created an account.</p>
    </div>

    <section class="stats">
      <div class="stat"><div class="n" id="statTotal">0</div><div class="l">Total users</div></div>
      <div class="stat"><div class="n" id="statShown">0</div><div class="l">Showing now</div></div>
    </section>

    <section class="panel">
      <div class="bar">
        <h2>All accounts</h2>
        <input type="search" id="search" placeholder="Search name or email" aria-label="Search users">
      </div>

      <div class="scroll">
        <table>
          <thead>
            <tr><th>#</th><th>User</th><th>Email</th><th></th></tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <p class="empty hidden" id="empty">No users found.</p>
    </section>
  </main>

  <!-- Confirm popup -->
  <div class="overlay hidden" id="overlay" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <div class="modal">
      <h3 id="mTitle">Remove user?</h3>
      <p id="mText"></p>
      <div class="actions">
        <button type="button" class="mbtn" id="no">Cancel</button>
        <button type="button" class="mbtn danger" id="yes" disabled>Yes (3)</button>
      </div>
    </div>
  </div>

  <script src="../js/admin.js"></script>
  <script src="../js/script.js"></script>

</body>
</html>
